[package]
name = "cinny-threads"
version = "4.12.6-threads.4"
description = "Thread-focused Cinny desktop client"
authors = ["Cinny contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/purpleempress/cinny-threads"
default-run = "cinny-threads"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-localhost = "2.3.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2.5.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
